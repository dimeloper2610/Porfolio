<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Share card</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative; background: #07070d; color: #ededf5; font-family: "Inter", sans-serif;
      padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .blob { position: absolute; border-radius: 50%; filter: blur(110px); opacity: .55; z-index: 0; }
    .b1 { width: 620px; height: 620px; background: #5b21b6; top: -300px; left: -160px; }
    .b2 { width: 520px; height: 520px; background: #0e7490; bottom: -280px; right: -120px; }
    .b3 { width: 420px; height: 420px; background: #3730a3; top: 120px; right: 260px; opacity: .35; }
    .grid {
      position: absolute; inset: 0; z-index: 0; opacity: .07;
      background-image: radial-gradient(#fff 1.2px, transparent 1.2px); background-size: 26px 26px;
    }
    body > *:not(.blob):not(.grid) { position: relative; z-index: 1; }

    .top { display: flex; align-items: center; gap: 24px; }
    .avatar { width: 112px; height: 112px; border-radius: 30px; padding: 4px; background: linear-gradient(120deg, #a78bfa, #818cf8 50%, #22d3ee); transform: rotate(-4deg); }
    .avatar img { width: 100%; height: 100%; border-radius: 26px; object-fit: cover; object-position: 50% 20%; display: block; }
    .name { font: 700 50px/1.05 "Space Grotesk", sans-serif; letter-spacing: -.03em; }
    .role { font: 500 17px "JetBrains Mono", monospace; color: #a78bfa; text-transform: uppercase; letter-spacing: .1em; margin-top: 10px; }

    h1 { font: 700 62px/1.05 "Space Grotesk", sans-serif; letter-spacing: -.035em; max-width: 980px; }
    .grad { background: linear-gradient(120deg, #a78bfa, #818cf8 50%, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }

    .bottom { display: flex; justify-content: space-between; align-items: flex-end; }
    .stats { display: flex; gap: 14px; }
    .stat { padding: 14px 20px; border-radius: 18px; background: rgba(22,22,36,.7); border: 1px solid rgba(255,255,255,.09); min-width: 170px; }
    .stat b { display: block; font: 700 34px/1 "Space Grotesk", sans-serif; background: linear-gradient(120deg, #a78bfa, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .stat span { display: block; font-size: 14.5px; color: #a3a5bd; margin-top: 6px; line-height: 1.3; }
    .url { font: 500 19px "JetBrains Mono", monospace; color: #c9cbe0; text-align: right; }
    .url small { display: block; color: #8b8da6; font-size: 14px; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grid"></div>

  <div class="top">
    <div class="avatar"><img src="../photo.jpg" alt="" /></div>
    <div>
      <p class="name">Dimitrios Fragkoulis</p>
      <p class="role">Engineering Team Lead · Stockholm</p>
    </div>
  </div>

  <h1>I build <span class="grad">teams</span> — and the frontend platforms they ship on.</h1>

  <div class="bottom">
    <div class="stats">
      <div class="stat"><b>30+</b><span>brands migrated<br />to Fabric</span></div>
      <div class="stat"><b>25+</b><span>micro-frontend<br />components</span></div>
      <div class="stat"><b>8</b><span>engineers in a<br />distributed team</span></div>
    </div>
    <p class="url"><small>Portfolio &amp; CV</small>dimeloper2610.github.io</p>
  </div>
</body>
</html>
